name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run test:vue-router-4
      # prepublishOnly builds the package. Trusted publishing (npm 11.5.1+, bundled with
      # Node 26) logs in with the workflow's OIDC token and adds provenance by itself
      - run: npm publish --access public
